<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>verify</title>
    <style>
        :root {
            --neon-blue: #00f0ff;
            --neon-green: #39ff14;
            --neon-red: #ff0055;
            --bg-dark: #0d1117;
            --panel-bg: rgba(20, 24, 33, 0.85);
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; right: -50%; bottom: -50%;
            background: radial-gradient(circle, rgba(0,240,255,0.05) 0%, transparent 70%);
            animation: pulseBg 8s infinite alternate;
            z-index: -1;
        }

        .container {
            position: relative;
            text-align: center;
            padding: 40px 60px;
            border-radius: 4px;
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 240, 255, 0.2);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.1), inset 0 0 15px rgba(0, 240, 255, 0.05);
            max-width: 500px;
            width: 90%;
            transition: all 0.5s ease;
        }

        .container::before, .container::after {
            content: '';
            position: absolute;
            width: 15px; height: 15px;
            border: 2px solid var(--neon-blue);
        }
        .container::before { top: -2px; left: -2px; border-right: none; border-bottom: none; }
        .container::after { bottom: -2px; right: -2px; border-left: none; border-top: none; }

        h1 {
            font-size: 22px;
            letter-spacing: 2px;
            margin-top: 0;
            margin-bottom: 25px;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(255,255,255,0.5);
        }

        p {
            color: #8b949e;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 0;
        }

        .scanline {
            width: 100%;
            height: 2px;
            background: rgba(0, 240, 255, 0.5);
            position: absolute;
            top: 0; left: 0;
            box-shadow: 0 0 10px var(--neon-blue);
            animation: scan 4s linear infinite;
            opacity: 0.7;
            pointer-events: none;
        }

        .loader {
            width: 40px; height: 40px;
            border: 3px solid rgba(0, 240, 255, 0.1);
            border-radius: 50%;
            border-top-color: var(--neon-blue);
            margin: 0 auto 20px;
            animation: spin 1s linear infinite;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        .status-success {
            border-color: rgba(57, 255, 20, 0.3) !important;
            box-shadow: 0 0 40px rgba(57, 255, 20, 0.15) !important;
        }
        .status-success h1 { color: var(--neon-green); text-shadow: 0 0 12px rgba(57, 255, 20, 0.6); }
        .status-success::before, .status-success::after { border-color: var(--neon-green); }

        .status-error {
            border-color: rgba(255, 0, 85, 0.3) !important;
            box-shadow: 0 0 40px rgba(255, 0, 85, 0.15) !important;
        }
        .status-error h1 { color: var(--neon-red); text-shadow: 0 0 12px rgba(255, 0, 85, 0.6); }
        .status-error::before, .status-error::after { border-color: var(--neon-red); }

        @keyframes scan {
            0% { top: 0%; }
            50% { top: 100%; }
            100% { top: 0%; }
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @keyframes pulseBg {
            to { transform: scale(1.1); opacity: 0.8; }
        }
    </style>
</head>
<body>
<body>
    <div class="container" id="panel">
        <div class="scanline"></div>
        <div class="loader" id="loader"></div>
        <h1 id="status-title">認証中...</h1>
        <p id="status-desc">しばらくお待ちください。</p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const status = urlParams.get('status');

        const panelEl = document.getElementById('panel');
        const titleEl = document.getElementById('status-title');
        const descEl = document.getElementById('status-desc');
        const loaderEl = document.getElementById('loader');

        if (status === 'success') {
            loaderEl.style.display = 'none';
            panelEl.classList.add('status-success');
            titleEl.innerText = '認証成功';
            descEl.innerHTML = '認証に成功しました<br>このタブを閉じてDiscordに戻ってください。';
        } else if (status === 'banned_email') {
            loaderEl.style.display = 'none';
            panelEl.classList.add('status-error');
            titleEl.innerText = '捨てめは無理';
            descEl.innerHTML = '使い捨てメールアドレスでの認証は許可されていません。';
        } else if (status === 'error') {
            loaderEl.style.display = 'none';
            panelEl.classList.add('status-error');
            titleEl.innerText = 'failed';
            descEl.innerHTML = '最初からやり直してください。';
        }
    </script>
</body>
</html>
